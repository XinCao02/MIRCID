[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mircid"
version = "0.1.0"
description = "Regulatory representations for perturbational drug modelling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "pillow>=9.5",
  "polars>=0.20",
  "pyarrow>=12",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "seaborn>=0.12",
  "torch>=2.0",
  "tqdm>=4.65",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
tfa = ["cmdstanpy>=1.2", "pyreadr>=0.5"]
legacy = ["ipython>=8", "plotly>=5", "tensorboard>=2", "wandb>=0.16"]

[tool.setuptools.packages.find]
where = ["src"]
